buffering.tooltip="Если функция включена, поток данных аудио/видео буферизируется для плавного и\nточного воспроизведения, но при этом увеличивается задержка. Если вы\nиспользуете карту захвата, рекомендуем программно установить одинаковую\nчастоту кадров для лучшего результата.\n\nЕсли функция отключена, поток воспроизводится с наименьшей задержкой,\nно при этом снижается точность воспроизведения кадров. Этот вариант\nидеален для веб-камер, или если вы хотите использовать окно предпросмотра\nпрограммы для игры на консоли.\n\nАвто-обнаружение (по умолчанию), устанавливает опцию на «Включено», если\nустройство имеет задержку, и на «Отключено», если не имеет задержки."
