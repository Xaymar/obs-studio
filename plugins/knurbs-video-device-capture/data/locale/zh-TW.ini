buffering.tooltip="啟用時，將會緩衝影音資料以確保平順且準確的播放，但將會\n增加延遲。當同時使用緩衝以及影音擷取卡時，建議將擷取卡\n與程式設定為同樣的擷取速率以獲得最好的效果。\n\n停用時，會有最少的延遲，但是畫面播放會較為不精準。建議\n使用於臉部攝影機或是利用本程式的預覽視窗來遊玩主機的情\n境。\n\n自動偵測(預設值)會在裝置有延遲時開啟，沒有延遲時關閉。"
